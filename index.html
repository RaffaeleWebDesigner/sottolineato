  --t-lavoro: #e6ecd9;
  --t-societa: #f3e4da;
  --t-potere: #e4e6e9;
  --t-fantasia: #dff2f6;
  --t-storia: #eee6d8;
  --t-scienza: #dbe7f0;
  --t-natura: #def0dc;
  --t-parole: #f5e3f0;
  --t-spazio: #dfe1f5;

  --t-cibo: #f7edcc;
  --t-arte: #efe0f5;
  --t-economia: #e9efd2;

}

html { height: 100%; box-sizing: border-box; color-scheme: light; padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }

body {

}
.solo-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Le viste (feed, esplora, salvate, profilo) stanno una sopra l'altra; ne è visibile una sola. La barra è sotto. */
.viste { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.vista { flex: 1; min-height: 0; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.vista:focus, [data-fuoco]:focus, .feed:focus { outline: none; }
.vista-feed { display: flex; flex-direction: column; }

.contenuto { max-width: 640px; margin-inline: auto; padding-block: 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.titolo-vista { font-family: var(--font-quote); font-size: 1.7rem; font-weight: 500; letter-spacing: -.01em; margin: 0; line-height: 1.15; }

.feedbar { display: flex; align-items: center; gap: 8px; padding-block: 8px 2px; max-width: 640px; width: 100%; margin-inline: auto; min-height: 42px; }

.brand span { background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%); padding-inline: 2px; }
.spazio { flex: 1; }
.rimaste { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mix { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 4px 10px; font-size: .78rem; font-weight: 600; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
#esplora-contenuto, #salvate-contenuto, #profilo-contenuto { display: flex; flex-direction: column; gap: 14px; }
.sezione { font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -4px; }
.riquadri { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.riquadro { position: relative; text-align: left; border: 0; border-radius: 18px; padding: 16px 14px; min-height: 104px; background: var(--tint, var(--chip)); color: var(--fg); display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.riquadro strong { font-family: var(--font-quote); font-size: 1.2rem; font-weight: 500; line-height: 1.15; }
.riquadro span { font-size: .8rem; color: var(--muted); }
.riquadro .pro { position: absolute; top: 10px; right: 10px; font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 6px; padding: 1px 5px; color: var(--fg); }
.indietro { align-self: flex-start; border: 0; background: transparent; padding: 4px 0; font-size: .86rem; font-weight: 600; color: var(--muted); }
.indietro::before { content: "‹ "; }
.grande { text-align: left; border: 0; border-radius: 16px; padding: 16px; background: var(--tint, var(--chip)); font-size: 1rem; font-weight: 600; }
.righe { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.riga { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--chip); border-radius: 14px; padding: 12px 14px; }
.riga .pallino { width: 14px; height: 14px; border-radius: 50%; background: var(--tint); border: 1px solid var(--line); flex: none; }

.filtro-attivo { padding: 4px 10px; font-size: .76rem; min-width: 0; max-width: 55vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }

/* Schermate a tutto schermo (onboarding, schede aperte, condivisione): <dialog> modali. */
dialog.schermo { border: 0; padding: 0; margin: 0; width: 100%; height: 100%; max-width: none; max-height: none; background: var(--bg); color: var(--fg); overflow-y: auto; }

.onboarding { display: flex; flex-direction: column; }
.onboarding[open] { display: flex; }
.onb-testa { display: flex; justify-content: space-between; align-items: center; padding: max(14px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 6px max(18px, env(safe-area-inset-left, 0px)); }
.onb-passo { font-size: .8rem; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.onb-salta, .onb-indietro { border: 0; background: transparent; padding: 10px 6px; font-weight: 600; color: var(--muted); font-size: .95rem; }
.onb-contenuto { flex: 1; width: 100%; max-width: 560px; margin-inline: auto; padding: 18px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.onb-titolo { font-family: var(--font-quote); font-size: clamp(1.9rem, 7vw, 2.6rem); font-weight: 500; letter-spacing: -.02em; line-height: 1.1; margin: 0; }
.onb-titolo:focus { outline: none; }
.onb-testo { margin: 0; font-size: 1.05rem; line-height: 1.5; color: var(--muted); max-width: 46ch; }
.onb-marchio { margin: 0; font-family: var(--font-quote); font-size: 1.4rem; }
.onb-marchio span { background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%); padding-inline: 2px; }
.onb-piede { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px max(18px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); max-width: 600px; width: 100%; margin-inline: auto; }
.onb-avanti { margin-left: auto; border: 0; border-radius: 999px; background: var(--chip-on); color: var(--chip-on-fg); padding: 14px 28px; font-weight: 700; font-size: 1rem; }
.onb-avanti:disabled { opacity: .35; cursor: default; }
.riquadro[aria-pressed="true"] { outline: 3px solid var(--fg); outline-offset: -3px; }
.riquadro[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 8px; right: 12px; font-weight: 700; }
.come { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.come li { display: flex; align-items: center; gap: 14px; font-size: 1.05rem; line-height: 1.4; }
.come .icona { flex: none; width: 46px; height: 46px; border-radius: 14px; background: var(--chip); border: 1px solid var(--line); display: grid; place-items: center; }
.come svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.scelte { display: flex; flex-direction: column; gap: 10px; }

/* Limite giornaliero (si vede solo con ?limite=1) e pagina dei piani. */
.card.limite { align-items: stretch; justify-content: center; gap: 14px; }
.limite-titolo { font-family: var(--font-quote); font-size: clamp(1.8rem, 7vw, 2.4rem); font-weight: 500; letter-spacing: -.02em; margin: 0; line-height: 1.1; }
.limite-tempo { margin: 0; color: var(--muted); line-height: 1.45; }
.limite-nota { margin: 0; font-size: .85rem; color: var(--muted); }
.limite-primario, .limite-secondario { border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 1rem; border: 1px solid var(--line); background: var(--chip); }
.limite-primario { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
.limite-primario:disabled, .limite-secondario:disabled { opacity: .4; cursor: default; }
dialog.pubblicita { border: 0; border-radius: 20px; padding: 24px; width: min(86vw, 360px); background: var(--chip); color: var(--fg); text-align: center; }
dialog.pubblicita::backdrop { background: rgba(0, 0, 0, .55); }
.pubblicita-etichetta { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.pubblicita-n { display: block; font-family: var(--font-quote); font-size: 3rem; margin: 6px 0 12px; }
.barra { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.pieno { height: 100%; width: 0; background: var(--marker); }
.piani { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.piano { border: 1px solid var(--line); background: var(--chip); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.piano h3 { margin: 0; font-family: var(--font-quote); font-size: 1.5rem; font-weight: 500; }
.piano p { margin: 0; }
.piano .prezzo { font-weight: 700; }

/* Condivisione come immagine. */
.condividi { display: flex; flex-direction: column; }
.condividi-corpo { width: 100%; max-width: 520px; margin-inline: auto; padding: max(58px, calc(env(safe-area-inset-top, 0px) + 50px)) max(16px, env(safe-area-inset-left, 0px)) max(18px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.anteprima { width: 100%; max-height: 58vh; object-fit: contain; border-radius: 14px; border: 1px solid var(--line); background: var(--chip); }
.condividi-azione { margin-left: 0; align-self: stretch; }

/* Salvate. */
.riga-salvata { display: flex; align-items: stretch; gap: 6px; }
.riga-salvata .riga { flex: 1; min-width: 0; }

.sezione-profilo { display: flex; flex-direction: column; gap: 12px; }

.numero span { font-size: .82rem; font-weight: 600; }
.numero small { font-size: .74rem; color: var(--muted); }
.barre { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.barra-riga { display: flex; justify-content: space-between; font-size: .86rem; margin-bottom: 4px; }
.barra-riga .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.pista { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }

.aperta-corpo .card { flex: 1; min-height: 0; height: auto; }
.riga-testo { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.riga .nome { min-width: 0; }

.tabbar { flex: none; display: flex; justify-content: center; background: var(--bg); border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px); }

.tab[aria-current="page"] { color: var(--fg); }

.tab:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }

.feed { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; scroll-snap-type: y mandatory; scrollbar-width: none; max-width: 640px; width: 100%; margin-inline: auto; }
.feed::-webkit-scrollbar { display: none; }

.card {
  height: 100%; border-radius: 22px; background: var(--tint, var(--chip));
  display: flex; flex-direction: column; padding: clamp(20px, 5vw, 36px); gap: 16px; overflow: hidden;
}
.card-head { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kind { color: var(--fg); }

.del-giorno { background: var(--marker); color: var(--fg); border-radius: 6px; padding: 2px 7px; letter-spacing: .06em; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
.body > :first-child { margin-top: auto; }
.body > :last-child { margin-bottom: auto; }

.q { margin: 0; font-family: var(--font-quote); font-size: clamp(1.55rem, 5.6vw, 2.35rem); line-height: 1.28; font-weight: 400; text-wrap: balance; }
.q.long { font-size: clamp(1.25rem, 4.4vw, 1.8rem); }
.q.idea { font-family: var(--font-ui); font-weight: 600; letter-spacing: -.015em; line-height: 1.2; font-size: clamp(1.5rem, 5.4vw, 2.2rem); }
.q.parola { font-family: var(--font-quote); font-style: italic; font-weight: 500; font-size: clamp(2.4rem, 11vw, 4.2rem); line-height: 1.05; letter-spacing: -.02em; overflow-wrap: anywhere; }
.q.sapevi { font-family: var(--font-ui); font-weight: 500; line-height: 1.3; font-size: clamp(1.3rem, 4.8vw, 1.85rem); }
.q mark {
  color: inherit; background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 82% / 0% 38%;
  transition: background-size .9s cubic-bezier(.3, .7, .2, 1) .15s; padding-inline: 1px;
}
.q.parola mark { background-position: 0 88%; }
.seen .q mark { background-size: 100% 38%; }
.def { margin: -6px 0 0; font-size: 1.1rem; line-height: 1.45; max-width: 46ch; }
.src { margin: 0; font-size: .95rem; line-height: 1.45; }
.src b { font-weight: 600; }
.src i { font-family: var(--font-quote); font-size: 1.08em; }
.src small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
.note { margin: 0; color: var(--muted); line-height: 1.5; max-width: 60ch; }

/* Quiz: la spiegazione non esiste finché non si risponde; poi entra dal basso. */
.esito:empty { display: none; }
.esito-testo { display: block; font-family: var(--font-quote); font-size: clamp(2rem, 9vw, 3rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.05; transform-origin: left center; }
.esito-testo.giusto { color: var(--ok); }
.esito-testo.sbagliato { color: var(--ko); }
.esito-testo.rimbalza { animation: rimbalzo .5s cubic-bezier(.3, 1.7, .5, 1); }
.spiega { display: flex; flex-direction: column; gap: 12px; }
.spiega .badge { align-self: flex-start; margin-bottom: 0; }
.spiega.entra { animation: sale .3s ease-out; }
.card.scossa { animation: scossone .4s ease-in-out; }
.coriandoli { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; }
@keyframes rimbalzo { 0% { transform: scale(.55); opacity: 0; } 60% { transform: scale(1.14); opacity: 1; } 100% { transform: scale(1); } }
@keyframes sale { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes scossone { 0%, 100% { transform: translateX(0); } 15% { transform: translateX(-12px); } 35% { transform: translateX(10px); } 55% { transform: translateX(-8px); } 75% { transform: translateX(5px); } 90% { transform: translateX(-2px); } }

.quiz { display: flex; flex-direction: column; gap: 8px; }
.quiz p { margin: 0; font-weight: 600; font-size: .9rem; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--chip); border-radius: 12px; padding: 9px 14px; font-weight: 500; text-align: left; }
.opt.right { border-color: var(--ok); color: var(--ok); }
.opt.wrong { border-color: var(--ko); color: var(--ko); }
.verdict { font-size: .88rem; min-height: 1.3em; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.act { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; font-size: .86rem; font-weight: 500; }
.act svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.act[aria-pressed="true"] svg { fill: currentColor; }
.act[aria-pressed="true"] { background: var(--chip); }

.empty { display: grid; place-content: center; text-align: center; gap: 8px; color: var(--muted); }
.empty strong { color: var(--fg); font-family: var(--font-quote); font-size: 1.4rem; font-weight: 500; }

.badge { display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 6px; padding: 3px 8px; margin-bottom: 8px; }
.badge.good { color: var(--ok); }
.badge.mid { color: var(--mid); }
.badge.bad { color: var(--ko); }
.spunto { background: var(--spunto); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.spunto-label { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.spunto p { margin: 0; font-family: var(--font-quote); font-style: italic; font-size: 1.12rem; line-height: 1.4; }

@media (prefers-reduced-motion: reduce) {
  .q mark { transition: none; background-size: 100% 38%; }
  .esito-testo.rimbalza, .spiega.entra, .card.scossa { animation: none; }
}
</style>
</head>

    </div>
  </section>

    </div>
  </section>

  <section class="vista vista-scroll" id="vista-profilo" aria-labelledby="titolo-profilo" tabindex="-1" hidden>

      <h2 class="titolo-vista" id="titolo-profilo" data-fuoco tabindex="-1" data-i18n="nav.profilo">Profilo</h2>
      <div id="profilo-contenuto"></div>

  </section>

  <section class="vista vista-scroll" id="vista-pro" aria-labelledby="titolo-pro" tabindex="-1" hidden>

      <div id="pro-contenuto"></div>
